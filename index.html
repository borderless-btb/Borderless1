  try{const r=await sm.json("Translate every string in this JSON array into "+L[lang][0]+" (language code "+lang+"). Use natural wording for students. Keep proper names, numbers, currency and exam acronyms (SAT, AP, IB, Gaokao, etc.) unchanged. Return ONLY a JSON array with the same length and order.\n"+JSON.stringify(bs[i]));
   if(Array.isArray(r)&&r.length===bs[i].length)bs[i].forEach((x,j)=>{if(typeof r[j]==="string"&&r[j])m[x]=r[j]});
   try{if(C.prefs)localStorage.setItem("tm",JSON.stringify(TM))}catch(e){}
   if(S.lang===lang)render(true)
  }catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited")){toast("Translation paused.");break}}
 }
 status("")
}

function wipe(){["os","tm","os_consent"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});toast("Data on this device deleted.");setTimeout(()=>location.reload(),900)}

function openJoin(){const y=new Date().getFullYear();$("#bx").innerHTML=`<h2>Join borderless</h2><p class="meta">Reading is open to everyone. To post, like or comment we ask for the minimum: a nickname and your year of birth.</p><label for="jn">Nickname (not your real name)</label><input id="jn" maxlength="40" autocomplete="nickname"><label for="jy">Year of birth</label><select id="jy" onchange="jAge()"><option value="">Select</option>${Array.from({length:90},(_,i)=>`<option>${y-5-i}</option>`).join("")}</select><p id="jm" class="meta" role="status"></p><label id="jg" style="display:none"><input type="checkbox" id="jgc" style="width:auto"> A parent or guardian has agreed to me joining.</label><label><input type="checkbox" id="jt" style="width:auto"> I agree to the <a href="#" onclick="closeM();go('terms');return false">Terms</a> and have read the <a href="#" onclick="closeM();go('privacy');return false">Privacy Policy</a>. (required)</label><label id="jmk"><input type="checkbox" id="jk" style="width:auto" onchange="$('#je').style.display=this.checked?'block':'none'"> Email me occasional borderless news. Optional. Every email has an unsubscribe link.</label><input id="je" type="email" autocomplete="email" aria-label="Email address" placeholder="Email, used only for these messages" style="display:none"><div class="row" style="margin-top:14px"><button class="btn g" onclick="doJoin()">Create account</button><button class="act" onclick="closeM()">${T("close")}</button></div>`;$("#mo").classList.add("on");$("#jn").focus()}

 /* prototype: the email is validated but not stored */
 S.me={name:n,yob:+$("#jy").value,guardian:a<16,marketing:mk,consentVersion:"2026-11-11",consentAt:new Date().toISOString()};save();closeM();toast("Welcome, "+n);render(true)}
